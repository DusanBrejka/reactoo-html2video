<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manchester City second half</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .overlay {
      position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      --ground: #0A3A78; --ink: #ffffff;
    }
    .overlay * { box-sizing: border-box; animation-play-state: paused; }
    .overlay.is-ready * { animation-play-state: running; }
    .plate-mask { position: absolute; top: 0; left: 0; height: 1080px; width: 0; overflow: hidden; }
    .plate {
      position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; background: var(--ground); color: var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    }
    .overlay.is-ready .plate-mask { animation: half-in .9s cubic-bezier(.16,1,.3,1) both; }
    .overlay.is-ready.is-exiting .plate-mask { animation: half-out .8s cubic-bezier(.7,0,.84,0) both; }
    .overlay.is-ready.is-exiting .plate { animation: half-slide-out .8s cubic-bezier(.7,0,.84,0) both; }
    .crests img { opacity: 0; transform: scale(.6) translateY(-12px); }
    .overlay.is-ready .crests img { animation: crest-in .6s linear both; }
    .overlay.is-ready .crests img:first-child { animation-delay: .28s; }
    .overlay.is-ready .crests img:last-child { animation-delay: .42s; }
    .overlay.is-ready .label { animation: title-in .8s cubic-bezier(.16,1,.3,1) .36s both; }
    .overlay.is-ready.is-exiting .crests img { animation: crest-out .8s linear both; }
    .overlay.is-ready.is-exiting .label { animation: title-out .8s linear both; }
    .crests { display: flex; gap: 22px; }
    .crests img { width: 72px; height: 96px; object-fit: contain; }
    .label { font: 800 132px/0.9 "Barlow Condensed", Impact, sans-serif; letter-spacing: .04em; text-transform: uppercase; opacity: 0; transform: scale(.78); }
    @keyframes half-in { from { width: 0; left: 0; } to { width: 1920px; left: 0; } }
    @keyframes half-out { 0%, 16% { width: 1920px; left: 0; } 100% { width: 0; left: 1920px; } }
    @keyframes half-slide-out { 0%, 16% { left: 0; } 100% { left: -1920px; } }
    @keyframes crest-in { 0% { opacity: 0; transform: translateY(-12px) scale(.6); } 70% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: none; } }
    @keyframes crest-out { 0%, 8% { opacity: 1; transform: none; } 40% { opacity: 0; transform: scale(.7); } 100% { opacity: 0; transform: scale(.7); } }
    @keyframes title-in { 0% { opacity: 0; letter-spacing: .28em; transform: scale(.78); } 100% { opacity: 1; letter-spacing: .04em; transform: scale(1); } }
    @keyframes title-out { 0% { opacity: 1; letter-spacing: .04em; transform: scale(1); } 36% { opacity: 0; letter-spacing: .16em; transform: scale(.9); } 100% { opacity: 0; letter-spacing: .16em; transform: scale(.9); } }
  </style>
</head>
<body>
  <div class="overlay" data-render-overlay>
    <div class="plate-mask">
    <div class="plate">
      <div class="crests"><img id="home-crest" alt=""><img id="away-crest" alt=""></div>
      <div class="label" id="label"></div>
    </div>
    </div>
  </div>
  <script>
  'use strict';
  const TEMPLATE_DIR = 'https://reactoo-html2video-dev3-458780930208.s3.eu-central-1.amazonaws.com/templates/mancity/';
  const GRAPHIC = {
    pageTitle: 'Manchester City second half',
    colors: { ground: '#0A3A78', ink: '#ffffff' },
    images: { homeCrest: 'crest-liverpool.png', awayCrest: 'crest-city.png' },
    text: { label: '2ND HALF' },
    animation: { hold: 2.6, tailPad: 0.2 }
  };
  function resolveAssetUrl(url) {
    if (!url) return '';
    if (/^(?:https?:|data:|file:|blob:)/i.test(url)) return url;
    var base = (location.protocol === 'file:') ? location.href : TEMPLATE_DIR;
    try { return new URL(url, base).href; } catch (e) { return base + encodeURIComponent(url); }
  }
  function setImg(id, url) {
    var el = document.getElementById(id);
    if (!el) return;
    url = resolveAssetUrl(url);
    if (url) { el.src = url; el.style.display = ''; }
    else { el.removeAttribute('src'); el.style.display = 'none'; }
  }
  function applyColors(config) {
    var overlay = document.querySelector('.overlay');
    var c = (config && config.colors) || {};
    Object.keys(c).forEach(function (key) { if (overlay && c[key]) overlay.style.setProperty('--' + key, c[key]); });
  }
  function applyGraphic(config) {
    config = config || GRAPHIC;
    document.title = config.pageTitle || GRAPHIC.pageTitle;
    applyColors(config);
    var images = config.images || {};
    var text = config.text || {};
    setImg('home-crest', images.homeCrest);
    setImg('away-crest', images.awayCrest);
    document.getElementById('label').textContent = text.label == null ? '' : String(text.label);
  }
  function applyAnimationTiming() {}
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { x = clamp01(x); return 1 - Math.pow(1 - x, 3); }
  function win(t, delay, dur) { return clamp01((t - delay) / dur); }
  function seekGraphic(t, config) {
    var hold = config.animation && config.animation.hold != null ? Number(config.animation.hold) : 2.6;
    var exiting = t >= hold;
    var u = exiting ? (t - hold) / 0.8 : t;
    var open = exiting ? (u < 0.16 ? 0 : easeOut((u - 0.16) / 0.84)) : easeOut(t / 0.9);
    var full = 1920;
    var left = exiting ? Math.round(full * clamp01(open)) : 0;
    var vis = exiting ? full - left : Math.round(full * clamp01(open));
    document.querySelectorAll('.plate-mask, .plate, .crests img, .label').forEach(function (node) { node.style.animation = 'none'; });
    var mask = document.querySelector('.plate-mask');
    var plate = document.querySelector('.plate');
    mask.style.left = left + 'px';
    mask.style.width = vis + 'px';
    mask.style.visibility = vis <= 0 ? 'hidden' : 'visible';
    plate.style.left = (-left) + 'px';
    document.querySelectorAll('.crests img').forEach(function (img, i) {
      var p = exiting ? (u < 0.08 ? 1 : 1 - clamp01((u - 0.08) / 0.32)) : win(t, i === 0 ? 0.28 : 0.42, 0.6);
      var s = exiting ? (0.7 + 0.3 * p) : (p < 0.7 ? 0.6 + 0.48 * (p / 0.7) : 1.08 - 0.08 * ((p - 0.7) / 0.3));
      img.style.opacity = String(clamp01(p));
      img.style.transform = 'scale(' + s.toFixed(3) + ')';
    });
    var label = document.querySelector('.label');
    var lp = exiting ? 1 - clamp01(u / 0.36) : win(t, 0.36, 0.8);
    label.style.opacity = String(clamp01(lp));
    label.style.letterSpacing = (0.28 - 0.24 * clamp01(lp)) + 'em';
    label.style.transform = 'scale(' + (0.78 + 0.22 * clamp01(lp)) + ')';
  }
  window.__RENDER_USE_TEMPLATE_SEEK__ = true;
  window.seekGraphic = seekGraphic;
  function preloadImages(urls) {
    var list = (urls || []).filter(Boolean);
    if (!list.length) return Promise.resolve();
    return Promise.all(list.map(function (url) {
      return new Promise(function (resolve) { var img = new Image(); img.onload = img.onerror = resolve; img.src = url; });
    }));
  }
  function scheduleExit(config) {
    config = config || window.GRAPHIC || GRAPHIC;
    var overlay = document.querySelector('.overlay');
    var holdSec = (config.animation && config.animation.hold != null) ? Number(config.animation.hold) : 2.6;
    setTimeout(function () {
      if (overlay && !window.__RENDER_WAIT_FOR_GO__) overlay.classList.add('is-exiting');
    }, holdSec * 1000);
  }
  function startAnimation(config) {
    if (window.__RENDER_WAIT_FOR_GO__) { window.__RENDER_ARMED__ = true; return; }
    var overlay = document.querySelector('.overlay');
    if (overlay) {
      overlay.classList.remove('is-exiting');
      overlay.classList.add('is-ready');
    }
    scheduleExit(config || window.GRAPHIC || GRAPHIC);
  }
  function initGraphic(config) {
    applyGraphic(config);
    var whenReady = function () {
      preloadImages(Object.values((config && config.images) || {}).map(resolveAssetUrl)).then(function () { startAnimation(config); });
    };
    if (document.readyState === 'complete') {
      whenReady();
    } else {
      window.addEventListener('load', whenReady, { once: true });
    }
  }
  window.applyGraphic = applyGraphic;
  window.applyAnimationTiming = applyAnimationTiming;
  window.GRAPHIC = GRAPHIC;
  initGraphic(GRAPHIC);
  </script>
</body>
</html>
