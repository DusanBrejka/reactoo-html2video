<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manchester City lineup</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .overlay {
      position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      font-family: "Barlow Condensed", Impact, sans-serif;
      --panel: #12315f; --ink: #ffffff; --num: #d5deee; --subs: #d5deee;
    }
    .overlay * { box-sizing: border-box; animation-play-state: paused; }
    .overlay.is-ready * { animation-play-state: running; }
    .panel-mask { position: absolute; left: 50%; top: 40px; height: 1000px; width: 0; margin-left: 0; overflow: hidden; }
    .panel {
      position: absolute; top: 0; left: -320px; width: 640px; min-height: 960px;
      background: linear-gradient(180deg, #1B4F8E 0%, #0E356C 38%, #0A2858 100%);
      color: var(--ink); padding: 36px 40px 28px;
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
    }
    .overlay.is-ready .panel-mask { animation: panel-in .98s cubic-bezier(.16,1,.3,1) both; }
    .overlay.is-ready .panel { animation: panel-shift-in .98s cubic-bezier(.16,1,.3,1) both; }
    .overlay.is-ready.is-exiting .panel-mask { animation: panel-out .9s cubic-bezier(.7,0,.84,0) both; }
    .overlay.is-ready.is-exiting .panel { animation: panel-shift-out .9s cubic-bezier(.7,0,.84,0) both; }
    .crests img { opacity: 0; transform: translateY(-18px) scale(.72); }
    .player { opacity: 0; }
    .subs-pill, .subs { opacity: 0; }
    .overlay.is-ready .crests img { animation: crest-in .62s linear both; }
    .overlay.is-ready .crests img:nth-child(1) { animation-delay: .3s; }
    .overlay.is-ready .crests img:nth-child(2) { animation-delay: .44s; }
    .overlay.is-ready .crests img:nth-child(3) { animation-delay: .58s; }
    .overlay.is-ready .player { animation: row-in .46s cubic-bezier(.16,1,.3,1) both; }
    .overlay.is-ready .player:nth-child(1) { animation-delay: .46s; }
    .overlay.is-ready .player:nth-child(2) { animation-delay: .51s; }
    .overlay.is-ready .player:nth-child(3) { animation-delay: .56s; }
    .overlay.is-ready .player:nth-child(4) { animation-delay: .61s; }
    .overlay.is-ready .player:nth-child(5) { animation-delay: .66s; }
    .overlay.is-ready .player:nth-child(6) { animation-delay: .71s; }
    .overlay.is-ready .player:nth-child(7) { animation-delay: .76s; }
    .overlay.is-ready .player:nth-child(8) { animation-delay: .81s; }
    .overlay.is-ready .player:nth-child(9) { animation-delay: .86s; }
    .overlay.is-ready .player:nth-child(10) { animation-delay: .91s; }
    .overlay.is-ready .player:nth-child(11) { animation-delay: .96s; }
    .overlay.is-ready .subs-pill { animation: meta-in .42s cubic-bezier(.16,1,.3,1) 1.2s both; }
    .overlay.is-ready .subs { animation: meta-in .48s cubic-bezier(.16,1,.3,1) 1.34s both; }
    .overlay.is-ready.is-exiting .crests img { animation: crest-out .9s linear both; }
    .overlay.is-ready.is-exiting .player { animation: row-out .9s linear both; }
    .overlay.is-ready.is-exiting .subs-pill, .overlay.is-ready.is-exiting .subs { animation: meta-out .9s linear both; }
    .crests { display: flex; justify-content: center; gap: 28px; margin-bottom: 18px; }
    .crests img { width: 70px; height: 78px; object-fit: contain; }
    #players { width: max-content; margin: 22px auto 0; }
    .player { display: flex; align-items: center; gap: 12px; margin: 1px 0; }
    .num { width: 42px; text-align: right; flex: none; color: #B7D0EA; font: 600 20px/1.2 "Barlow Condensed", Impact, sans-serif; }
    .name { flex: none; font: 700 36px/1.15 "Barlow Condensed", Impact, sans-serif; letter-spacing: .02em; text-transform: uppercase; }
    .captain {
      width: 18px; height: 18px; border: 1.5px solid rgba(255,255,255,.85); border-radius: 50%;
      font: 700 11px/15px Barlow, sans-serif; text-align: center;
    }
    .subs-wrap { margin-top: 26px; text-align: center; }
    .subs-pill {
      display: inline-block; border: 1px solid rgba(255,255,255,.6); border-radius: 14px;
      padding: 4px 16px 3px; font: 600 12px/1 Barlow, sans-serif; letter-spacing: .18em;
    }
    .subs { margin-top: 16px; color: rgba(255,255,255,.42); font: 600 13px/1.4 "Barlow Condensed", sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    @keyframes panel-in { from { width: 0; margin-left: 0; } to { width: 640px; margin-left: -320px; overflow: visible; } }
    @keyframes panel-out { 0%, 24% { width: 640px; margin-left: -320px; } 100% { width: 0; margin-left: 0; } }
    @keyframes panel-shift-in { from { left: -320px; } to { left: 0; } }
    @keyframes panel-shift-out { 0%, 24% { left: 0; } 100% { left: -320px; } }
    @keyframes crest-in { 0% { opacity: 0; transform: translateY(-18px) scale(.72); } 70% { opacity: 1; transform: translateY(2px) scale(1.05); } 100% { opacity: 1; transform: none; } }
    @keyframes crest-out { 0%, 10% { opacity: 1; transform: none; } 42% { opacity: 0; transform: translateY(-12px) scale(.8); } 100% { opacity: 0; transform: translateY(-12px) scale(.8); } }
    @keyframes row-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes row-out { 0%, 6% { opacity: 1; transform: none; } 40% { opacity: 0; transform: translateY(10px); } 100% { opacity: 0; transform: translateY(10px); } }
    @keyframes meta-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes meta-out { 0% { opacity: 1; } 28% { opacity: 0; } 100% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="overlay" data-render-overlay>
    <div class="panel-mask">
    <div class="panel">
      <div class="crests">
        <img id="left-crest" alt="">
        <img id="league-crest" alt="">
        <img id="right-crest" alt="">
      </div>
      <div id="players"></div>
      <div class="subs-wrap">
        <div class="subs-pill" id="subs-label"></div>
        <div class="subs" id="subs"></div>
      </div>
    </div>
    </div>
  </div>
  <script>
  'use strict';
  const TEMPLATE_DIR = 'https://reactoo-html2video-dev3-458780930208.s3.eu-central-1.amazonaws.com/templates/mancity/';
  const GRAPHIC = {
    pageTitle: 'Manchester City lineup',
    colors: { panel: '#12315f', ink: '#ffffff', num: '#d5deee', subs: '#d5deee' },
    images: { leftCrest: 'crest-liverpool.png', leagueCrest: 'crest-league.png', rightCrest: 'crest-city.png' },
    text: {
      subsLabel: 'SUBS',
      subs: 'RULLI / REIS / GVARDIOL / KHUSANOV / LEWIS / KOVACIC / BOUADDI / ALLAN / DOKU',
      players: [
        { number: '1', name: 'Donnarumma' },
        { number: '27', name: 'Nunes' },
        { number: '3', name: 'Dias', captain: true },
        { number: '6', name: 'Gu\u00e9hi' },
        { number: '33', name: "O'Reilly" },
        { number: '17', name: 'Fern\u00e1ndez' },
        { number: '5', name: 'Anderson' },
        { number: '7', name: 'Ndiaye' },
        { number: '10', name: 'Cherki' },
        { number: '42', name: 'Semenyo' },
        { number: '9', name: 'Haaland' }
      ]
    },
    animation: { hold: 5.2, tailPad: 0.2 }
  };
  function resolveAssetUrl(url) {
    if (!url) return '';
    if (/^(?:https?:|data:|file:|blob:)/i.test(url)) return url;
    var base = (location.protocol === 'file:') ? location.href : TEMPLATE_DIR;
    try { return new URL(url, base).href; } catch (e) { return base + encodeURIComponent(url); }
  }
  function setImg(id, url) {
    var el = document.getElementById(id);
    if (!el) return;
    url = resolveAssetUrl(url);
    if (url) { el.src = url; el.style.display = ''; }
    else { el.removeAttribute('src'); el.style.display = 'none'; }
  }
  function applyColors(config) {
    var overlay = document.querySelector('.overlay');
    var c = (config && config.colors) || {};
    Object.keys(c).forEach(function (key) { if (overlay && c[key]) overlay.style.setProperty('--' + key, c[key]); });
  }
  function renderPlayers(list) {
    var root = document.getElementById('players');
    root.textContent = '';
    (list || []).forEach(function (player) {
      var row = document.createElement('div');
      row.className = 'player';
      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = player.number == null ? '' : String(player.number);
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = player.name || '';
      row.appendChild(num);
      row.appendChild(name);
      if (player.captain) {
        var mark = document.createElement('span');
        mark.className = 'captain';
        mark.textContent = 'C';
        row.appendChild(mark);
      }
      root.appendChild(row);
    });
  }
  function applyGraphic(config) {
    config = config || GRAPHIC;
    document.title = config.pageTitle || GRAPHIC.pageTitle;
    applyColors(config);
    var images = config.images || {};
    var text = config.text || {};
    setImg('left-crest', images.leftCrest);
    setImg('league-crest', images.leagueCrest);
    setImg('right-crest', images.rightCrest);
    renderPlayers(text.players);
    var label = document.getElementById('subs-label');
    label.textContent = text.subsLabel == null ? 'SUBS' : String(text.subsLabel);
    label.style.display = label.textContent ? '' : 'none';
    var subs = document.getElementById('subs');
    subs.textContent = text.subs == null ? '' : String(text.subs);
    subs.style.display = subs.textContent ? '' : 'none';
  }
  function applyAnimationTiming() {}
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function easeOut(x) { x = clamp01(x); return 1 - Math.pow(1 - x, 3); }
  function win(t, delay, dur) { return clamp01((t - delay) / dur); }
  function seekGraphic(t, config) {
    var hold = config.animation && config.animation.hold != null ? Number(config.animation.hold) : 5.2;
    var exiting = t >= hold;
    var u = exiting ? (t - hold) / 0.9 : t;
    var open = exiting ? (u < 0.24 ? 1 : 1 - easeOut((u - 0.24) / 0.76)) : easeOut(t / 0.98);
    document.querySelectorAll('.panel-mask, .panel, .crests img, .player, .subs-pill, .subs').forEach(function (node) { node.style.animation = 'none'; });
    var full = 640;
    var vis = Math.round(full * clamp01(open));
    var mask = document.querySelector('.panel-mask');
    var el = document.querySelector('.panel');
    mask.style.width = vis + 'px';
    mask.style.marginLeft = (-vis / 2) + 'px';
    mask.style.overflow = open >= 0.999 ? 'visible' : 'hidden';
    mask.style.visibility = open <= 0 ? 'hidden' : 'visible';
    el.style.left = ((vis - full) / 2) + 'px';
    document.querySelectorAll('.crests img').forEach(function (img, i) {
      var p = exiting ? (u < 0.1 ? 1 : 1 - clamp01((u - 0.1) / 0.32)) : win(t, 0.3 + i * 0.14, 0.62);
      var s = exiting ? (0.8 + 0.2 * p) : (p < 0.7 ? 0.72 + 0.33 * (p / 0.7) : 1.05 - 0.05 * ((p - 0.7) / 0.3));
      img.style.opacity = String(clamp01(p));
      img.style.transform = 'translateY(' + ((1 - clamp01(p)) * -18) + 'px) scale(' + s.toFixed(3) + ')';
    });
    document.querySelectorAll('.player').forEach(function (row, i) {
      var p = exiting ? (u < 0.06 ? 1 : 1 - clamp01((u - 0.06) / 0.34)) : win(t, 0.46 + i * 0.05, 0.46);
      row.style.opacity = String(clamp01(p));
      row.style.transform = 'translateY(' + ((1 - clamp01(p)) * 16) + 'px)';
    });
    var pill = document.querySelector('.subs-pill');
    var subs = document.querySelector('.subs');
    var pillP = exiting ? 1 - clamp01(u / 0.28) : win(t, 1.2, 0.42);
    var subsP = exiting ? 1 - clamp01(u / 0.28) : win(t, 1.34, 0.48);
    pill.style.opacity = String(clamp01(pillP));
    subs.style.opacity = String(clamp01(subsP));
  }
  window.__RENDER_USE_TEMPLATE_SEEK__ = true;
  window.seekGraphic = seekGraphic;
  function preloadImages(urls) {
    var list = (urls || []).filter(Boolean);
    if (!list.length) return Promise.resolve();
    return Promise.all(list.map(function (url) {
      return new Promise(function (resolve) { var img = new Image(); img.onload = img.onerror = resolve; img.src = url; });
    }));
  }
  function scheduleExit(config) {
    config = config || window.GRAPHIC || GRAPHIC;
    var overlay = document.querySelector('.overlay');
    var holdSec = (config.animation && config.animation.hold != null) ? Number(config.animation.hold) : 5.2;
    setTimeout(function () {
      if (overlay && !window.__RENDER_WAIT_FOR_GO__) overlay.classList.add('is-exiting');
    }, holdSec * 1000);
  }
  function startAnimation(config) {
    if (window.__RENDER_WAIT_FOR_GO__) { window.__RENDER_ARMED__ = true; return; }
    var overlay = document.querySelector('.overlay');
    if (overlay) {
      overlay.classList.remove('is-exiting');
      overlay.classList.add('is-ready');
    }
    scheduleExit(config || window.GRAPHIC || GRAPHIC);
  }
  function initGraphic(config) {
    applyGraphic(config);
    var whenReady = function () {
      preloadImages(Object.values((config && config.images) || {}).map(resolveAssetUrl)).then(function () { startAnimation(config); });
    };
    if (document.readyState === 'complete') {
      whenReady();
    } else {
      window.addEventListener('load', whenReady, { once: true });
    }
  }
  window.applyGraphic = applyGraphic;
  window.applyAnimationTiming = applyAnimationTiming;
  window.GRAPHIC = GRAPHIC;
  initGraphic(GRAPHIC);
  </script>
</body>
</html>
