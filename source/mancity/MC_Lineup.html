<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manchester City lineup</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .overlay {
      position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      font-family: "Barlow Condensed", Impact, sans-serif;
      --panel: #12315f; --ink: #ffffff; --num: #d5deee; --subs: #d5deee;
    }
    .overlay * { box-sizing: border-box; animation-play-state: paused; }
    .overlay.is-ready * { animation-play-state: running; }
    .panel {
      position: absolute; left: 50%; top: 70px; width: 560px; margin-left: -280px; min-height: 860px;
      background: var(--panel); color: var(--ink); padding: 28px 36px 32px;
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
      animation: panel-in .5s cubic-bezier(.2,.8,.2,1) both;
    }
    .overlay.is-exiting .panel { animation: panel-out .4s ease both; }
    .crests { display: flex; justify-content: center; gap: 28px; margin-bottom: 18px; }
    .crests img { width: 54px; height: 54px; object-fit: contain; }
    #players { width: max-content; margin: 0 auto; }
    .player { display: flex; align-items: center; gap: 10px; margin: 2px 0; }
    .num { width: 46px; text-align: right; flex: none; color: var(--num); font: 600 22px/1.15 "Barlow Condensed", Impact, sans-serif; }
    .name { flex: none; font: 700 34px/1.15 "Barlow Condensed", Impact, sans-serif; letter-spacing: .03em; text-transform: uppercase; }
    .captain {
      width: 18px; height: 18px; border: 1.5px solid var(--ink); border-radius: 50%;
      font: 700 11px/16px "Barlow Condensed", Impact, sans-serif; text-align: center;
    }
    .subs { margin-top: 22px; text-align: center; color: var(--subs); font: 600 15px/1.35 "Barlow Condensed", Impact, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    @keyframes panel-in { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    @keyframes panel-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(16px); } }
  </style>
</head>
<body>
  <div class="overlay" data-render-overlay>
    <div class="panel">
      <div class="crests">
        <img id="left-crest" alt="">
        <img id="league-crest" alt="">
        <img id="right-crest" alt="">
      </div>
      <div id="players"></div>
      <div class="subs" id="subs"></div>
    </div>
  </div>
  <script>
  'use strict';
  const TEMPLATE_DIR = 'https://reactoo-html2video-dev3-458780930208.s3.eu-central-1.amazonaws.com/templates/mancity/';
  const GRAPHIC = {
    pageTitle: 'Manchester City lineup',
    colors: { panel: '#12315f', ink: '#ffffff', num: '#d5deee', subs: '#d5deee' },
    images: { leftCrest: 'home.svg', leagueCrest: 'league.svg', rightCrest: 'city.png' },
    text: {
      subs: 'SUBS  RULLI / REIS / GVARDIOL / KHUSANOV / LEWIS / KOVACIC / BOUADDI / ALLAN / DOKU',
      players: [
        { number: '1', name: 'Donnarumma' },
        { number: '27', name: 'Nunes' },
        { number: '3', name: 'Dias', captain: true },
        { number: '6', name: 'Guehi' },
        { number: '33', name: "O'Reilly" },
        { number: '17', name: 'Fernandez' },
        { number: '5', name: 'Anderson' },
        { number: '7', name: 'Ndiaye' },
        { number: '10', name: 'Cherki' },
        { number: '42', name: 'Semenyo' },
        { number: '9', name: 'Haaland' }
      ]
    },
    animation: { hold: 4.2, tailPad: 0.2 }
  };
  function resolveAssetUrl(url) {
    if (!url) return '';
    if (/^(?:https?:|data:|file:|blob:)/i.test(url)) return url;
    var base = (location.protocol === 'file:') ? location.href : TEMPLATE_DIR;
    try { return new URL(url, base).href; } catch (e) { return base + encodeURIComponent(url); }
  }
  function setImg(id, url) {
    var el = document.getElementById(id);
    if (!el) return;
    url = resolveAssetUrl(url);
    if (url) { el.src = url; el.style.display = ''; }
    else { el.removeAttribute('src'); el.style.display = 'none'; }
  }
  function applyColors(config) {
    var overlay = document.querySelector('.overlay');
    var c = (config && config.colors) || {};
    Object.keys(c).forEach(function (key) { if (overlay && c[key]) overlay.style.setProperty('--' + key, c[key]); });
  }
  function renderPlayers(list) {
    var root = document.getElementById('players');
    root.textContent = '';
    (list || []).forEach(function (player) {
      var row = document.createElement('div');
      row.className = 'player';
      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = player.number == null ? '' : String(player.number);
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = player.name || '';
      row.appendChild(num);
      row.appendChild(name);
      if (player.captain) {
        var mark = document.createElement('span');
        mark.className = 'captain';
        mark.textContent = 'C';
        row.appendChild(mark);
      }
      root.appendChild(row);
    });
  }
  function applyGraphic(config) {
    config = config || GRAPHIC;
    document.title = config.pageTitle || GRAPHIC.pageTitle;
    applyColors(config);
    var images = config.images || {};
    var text = config.text || {};
    setImg('left-crest', images.leftCrest);
    setImg('league-crest', images.leagueCrest);
    setImg('right-crest', images.rightCrest);
    renderPlayers(text.players);
    var subs = document.getElementById('subs');
    subs.textContent = text.subs == null ? '' : String(text.subs);
    subs.style.display = subs.textContent ? '' : 'none';
  }
  function applyAnimationTiming() {}
  function preloadImages(urls) {
    var list = (urls || []).filter(Boolean);
    if (!list.length) return Promise.resolve();
    return Promise.all(list.map(function (url) {
      return new Promise(function (resolve) { var img = new Image(); img.onload = img.onerror = resolve; img.src = url; });
    }));
  }
  function startAnimation() {
    if (window.__RENDER_WAIT_FOR_GO__) { window.__RENDER_ARMED__ = true; return; }
    var overlay = document.querySelector('.overlay');
    if (overlay) overlay.classList.add('is-ready');
  }
  function initGraphic(config) {
    applyGraphic(config);
    var ready = function () { preloadImages(Object.values((config && config.images) || {}).map(resolveAssetUrl)).then(startAnimation); };
    if (document.readyState === 'complete') ready();
    else window.addEventListener('load', ready, { once: true });
  }
  window.applyGraphic = applyGraphic;
  window.applyAnimationTiming = applyAnimationTiming;
  window.GRAPHIC = GRAPHIC;
  initGraphic(GRAPHIC);
  </script>
</body>
</html>
