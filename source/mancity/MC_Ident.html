<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manchester City match bar</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .overlay {
      position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      font-family: "Barlow Condensed", Impact, sans-serif;
      --home: #C8102E; --away: #6CB4FF; --ink: #ffffff; --ground: #071833; --tab: #1E4E9A;
    }
    .overlay * { box-sizing: border-box; animation-play-state: paused; }
    .overlay.is-ready * { animation-play-state: running; }
    .ident {
      position: absolute; left: 50%; bottom: 168px; width: 1040px; margin-left: -520px; height: 86px;
      animation: ident-in .45s cubic-bezier(.2,.8,.2,1) both;
    }
    .overlay.is-exiting .ident { animation: ident-out .4s ease both; }
    .bar { display: flex; height: 86px; color: var(--ink); filter: drop-shadow(0 10px 18px rgba(0,0,0,.35)); }
    .side { flex: 1; display: flex; align-items: center; gap: 16px; padding: 0 22px; font: 700 42px/1 "Barlow Condensed", Impact, sans-serif; letter-spacing: .02em; text-transform: uppercase; }
    .home { background: linear-gradient(90deg, var(--home), var(--ground)); justify-content: flex-start; }
    .away { background: linear-gradient(90deg, var(--ground), var(--away)); justify-content: flex-end; }
    .league { width: 92px; display: flex; align-items: center; justify-content: center; background: var(--ground); }
    .league img, .side img { width: 58px; height: 58px; object-fit: contain; }
    .tab, .date { position: absolute; color: var(--ink); text-transform: uppercase; animation: meta-in .35s ease .4s both; }
    .tab { left: 0; top: -26px; background: var(--tab); font: 700 16px/1 "Barlow Condensed", Impact, sans-serif; letter-spacing: .16em; padding: 6px 12px; }
    .date { right: 0; bottom: -24px; font: 600 16px/1 "Barlow Condensed", Impact, sans-serif; letter-spacing: .08em; }
    @keyframes ident-in { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: none; } }
    @keyframes ident-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(28px); } }
    @keyframes meta-in { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="overlay" data-render-overlay>
    <div class="ident">
      <div class="tab" id="stadium"></div>
      <div class="bar">
        <div class="side home"><img id="home-crest" alt=""><span id="home-name"></span></div>
        <div class="league"><img id="league-crest" alt=""></div>
        <div class="side away"><span id="away-name"></span><img id="away-crest" alt=""></div>
      </div>
      <div class="date" id="date"></div>
    </div>
  </div>
  <script>
  'use strict';
  const TEMPLATE_DIR = 'https://reactoo-html2video-dev3-458780930208.s3.eu-central-1.amazonaws.com/templates/mancity/';
  const GRAPHIC = {
    pageTitle: 'Manchester City match bar',
    colors: { home: '#C8102E', away: '#6CB4FF', ink: '#ffffff', ground: '#071833', tab: '#1E4E9A' },
    images: { homeCrest: 'home.svg', awayCrest: 'city.png', leagueCrest: 'league.svg' },
    text: { homeName: 'Liverpool', awayName: 'Man City', stadium: 'ANFIELD', date: 'SUN 11/10/26 - 16:30 (UK)' },
    animation: { hold: 3.2, tailPad: 0.2 }
  };
  function resolveAssetUrl(url) {
    if (!url) return '';
    if (/^(?:https?:|data:|file:|blob:)/i.test(url)) return url;
    var base = (location.protocol === 'file:') ? location.href : TEMPLATE_DIR;
    try { return new URL(url, base).href; } catch (e) { return base + encodeURIComponent(url); }
  }
  function setImg(id, url) {
    var el = document.getElementById(id);
    if (!el) return;
    url = resolveAssetUrl(url);
    if (url) { el.src = url; el.style.display = ''; }
    else { el.removeAttribute('src'); el.style.display = 'none'; }
  }
  function setText(id, value) {
    var el = document.getElementById(id);
    if (!el) return;
    var text = value == null ? '' : String(value);
    el.textContent = text;
    el.style.display = text ? '' : 'none';
  }
  function applyColors(config) {
    var overlay = document.querySelector('.overlay');
    var c = (config && config.colors) || {};
    Object.keys(c).forEach(function (key) { if (overlay && c[key]) overlay.style.setProperty('--' + key, c[key]); });
  }
  function applyGraphic(config) {
    config = config || GRAPHIC;
    document.title = config.pageTitle || GRAPHIC.pageTitle;
    applyColors(config);
    var images = config.images || {};
    var text = config.text || {};
    setImg('home-crest', images.homeCrest);
    setImg('away-crest', images.awayCrest);
    setImg('league-crest', images.leagueCrest);
    setText('home-name', text.homeName);
    setText('away-name', text.awayName);
    setText('stadium', text.stadium);
    setText('date', text.date);
  }
  function applyAnimationTiming() {}
  function preloadImages(urls) {
    var list = (urls || []).filter(Boolean);
    if (!list.length) return Promise.resolve();
    return Promise.all(list.map(function (url) {
      return new Promise(function (resolve) {
        var img = new Image();
        img.onload = img.onerror = resolve;
        img.src = url;
      });
    }));
  }
  function startAnimation() {
    if (window.__RENDER_WAIT_FOR_GO__) { window.__RENDER_ARMED__ = true; return; }
    var overlay = document.querySelector('.overlay');
    if (overlay) overlay.classList.add('is-ready');
  }
  function initGraphic(config) {
    applyGraphic(config);
    var ready = function () {
      preloadImages(Object.values((config && config.images) || {}).map(resolveAssetUrl)).then(startAnimation);
    };
    if (document.readyState === 'complete') ready();
    else window.addEventListener('load', ready, { once: true });
  }
  window.applyGraphic = applyGraphic;
  window.applyAnimationTiming = applyAnimationTiming;
  window.GRAPHIC = GRAPHIC;
  initGraphic(GRAPHIC);
  </script>
</body>
</html>
