<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manchester City minute</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .overlay {
      position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      --pill: #1E4FA8; --ink: #ffffff;
    }
    .overlay * { box-sizing: border-box; animation-play-state: paused; }
    .overlay.is-ready * { animation-play-state: running; }
    .pill {
      position: absolute; left: 48px; bottom: 52px; margin: 0;
      background: var(--pill); color: var(--ink);
      font: 800 40px/1 "Barlow Condensed", Impact, sans-serif;
      padding: 10px 22px 8px; border-radius: 26px;
      transform-origin: left center;
      transform: scale(0);
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.35));
    }
    .overlay.is-ready .pill { animation: clock-in .72s linear both; }
    .overlay.is-ready.is-exiting .pill { animation: clock-out .5s cubic-bezier(.7,0,.84,0) both; }
    @keyframes clock-in {
      0% { opacity: 0; transform: translateY(22px) scale(.15); filter: blur(10px); }
      58% { opacity: 1; transform: translateY(-6px) scale(1.12); filter: blur(0); }
      78% { opacity: 1; transform: translateY(2px) scale(.97); filter: blur(0); }
      100% { opacity: 1; transform: none; filter: blur(0); }
    }
    @keyframes clock-out {
      0% { opacity: 1; transform: none; filter: blur(0); }
      100% { opacity: 0; transform: translateY(16px) scale(.2); filter: blur(6px); }
    }
  </style>
</head>
<body>
  <div class="overlay" data-render-overlay>
    <p class="pill" id="minute"></p>
  </div>
  <script>
  'use strict';
  const GRAPHIC = {
    pageTitle: 'Manchester City minute',
    colors: { pill: '#1E4FA8', ink: '#ffffff' },
    text: { minute: "19'" },
    animation: { hold: 3.6, tailPad: 0.2 }
  };
  function applyColors(config) {
    var overlay = document.querySelector('.overlay');
    var c = (config && config.colors) || {};
    Object.keys(c).forEach(function (key) { if (overlay && c[key]) overlay.style.setProperty('--' + key, c[key]); });
  }
  function applyGraphic(config) {
    config = config || GRAPHIC;
    document.title = config.pageTitle || GRAPHIC.pageTitle;
    applyColors(config);
    var text = (config.text || {}).minute;
    document.getElementById('minute').textContent = text == null ? '' : String(text);
  }
  function applyAnimationTiming() {}
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function seekGraphic(t, config) {
    var hold = config.animation && config.animation.hold != null ? Number(config.animation.hold) : 3.6;
    var pill = document.getElementById('minute');
    pill.style.animation = 'none';
    pill.style.transformOrigin = 'left center';
    var s, y, blur, op;
    if (t < hold) {
      var p = clamp01(t / 0.72);
      if (p < 0.58) {
        var u = p / 0.58;
        s = 0.15 + 0.97 * u; y = 22 - 28 * u; blur = 10 * (1 - u); op = Math.min(1, u * 1.3);
      } else if (p < 0.78) {
        var u2 = (p - 0.58) / 0.2;
        s = 1.12 - 0.15 * u2; y = -6 + 8 * u2; blur = 0; op = 1;
      } else {
        var u3 = (p - 0.78) / 0.22;
        s = 0.97 + 0.03 * u3; y = 2 * (1 - u3); blur = 0; op = 1;
      }
    } else {
      var p2 = clamp01((t - hold) / 0.5);
      s = 1 - 0.8 * p2; y = 16 * p2; blur = 6 * p2; op = 1 - p2;
    }
    pill.style.opacity = String(clamp01(op));
    pill.style.filter = blur > 0.2 ? 'blur(' + blur.toFixed(2) + 'px) drop-shadow(0 8px 14px rgba(0,0,0,.35))' : 'drop-shadow(0 8px 14px rgba(0,0,0,.35))';
    pill.style.transform = 'translateY(' + y.toFixed(2) + 'px) scale(' + Math.max(s, 0.001).toFixed(3) + ')';
  }
  window.__RENDER_USE_TEMPLATE_SEEK__ = true;
  window.seekGraphic = seekGraphic;
  function scheduleExit(config) {
    config = config || window.GRAPHIC || GRAPHIC;
    var overlay = document.querySelector('.overlay');
    var holdSec = (config.animation && config.animation.hold != null) ? Number(config.animation.hold) : 3.6;
    setTimeout(function () {
      if (overlay && !window.__RENDER_WAIT_FOR_GO__) overlay.classList.add('is-exiting');
    }, holdSec * 1000);
  }
  function startAnimation(config) {
    if (window.__RENDER_WAIT_FOR_GO__) { window.__RENDER_ARMED__ = true; return; }
    var overlay = document.querySelector('.overlay');
    if (overlay) {
      overlay.classList.remove('is-exiting');
      overlay.classList.add('is-ready');
    }
    scheduleExit(config || window.GRAPHIC || GRAPHIC);
  }
  function initGraphic(config) {
    applyGraphic(config);
    var whenReady = function () { startAnimation(config); };
    if (document.readyState === 'complete') {
      whenReady();
    } else {
      window.addEventListener('load', whenReady, { once: true });
    }
  }
  window.applyGraphic = applyGraphic;
  window.applyAnimationTiming = applyAnimationTiming;
  window.GRAPHIC = GRAPHIC;
  initGraphic(GRAPHIC);
  </script>
</body>
</html>
