<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manchester City minute</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .overlay {
      position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      --pill: #1E4FA8; --ink: #ffffff;
    }
    .overlay * { box-sizing: border-box; animation-play-state: paused; }
    .overlay.is-ready * { animation-play-state: running; }
    .pill {
      position: absolute; left: 48px; bottom: 52px; margin: 0;
      background: var(--pill); color: var(--ink);
      font: 800 40px/1 "Barlow Condensed", Impact, sans-serif;
      padding: 10px 22px 8px; border-radius: 26px;
      transform-origin: left center;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.35));
    }
    .beat { position: absolute; width: 0; height: 0; opacity: 0; }
    .overlay.is-exiting .beat { animation: beat-out .16s linear both; }
    @keyframes beat-out { from { opacity: 0; } to { opacity: 0; } }
  </style>
</head>
<body>
  <div class="overlay" data-render-overlay>
    <p class="pill" id="minute"></p>
    <div class="beat"></div>
  </div>
  <script>
  'use strict';
  const GRAPHIC = {
    pageTitle: 'Manchester City minute',
    colors: { pill: '#1E4FA8', ink: '#ffffff' },
    text: { minute: "19'" },
    animation: { hold: 3, tailPad: 0.2 }
  };
  function applyColors(config) {
    var overlay = document.querySelector('.overlay');
    var c = (config && config.colors) || {};
    Object.keys(c).forEach(function (key) { if (overlay && c[key]) overlay.style.setProperty('--' + key, c[key]); });
  }
  function applyGraphic(config) {
    config = config || GRAPHIC;
    document.title = config.pageTitle || GRAPHIC.pageTitle;
    applyColors(config);
    var text = (config.text || {}).minute;
    document.getElementById('minute').textContent = text == null ? '' : String(text);
  }
  function applyAnimationTiming() {}
  function wipeEase(x) { x = Math.max(0, Math.min(1, x)); return 1 - Math.pow(1 - x, 3); }
  function seekGraphic(t, config) {
    var hold = config.animation && config.animation.hold != null ? Number(config.animation.hold) : 3;
    var inn = 0.16, outd = 0.16;
    var pill = document.getElementById('minute');
    var s;
    if (t < inn) {
      var p = wipeEase(t / inn);
      s = p < 0.75 ? (p / 0.75) * 1.05 : 1.05 - 0.05 * ((p - 0.75) / 0.25);
    } else if (t < hold) s = 1;
    else s = 1 - wipeEase(Math.min(1, (t - hold) / outd));
    pill.style.animation = 'none';
    pill.style.transformOrigin = 'left center';
    pill.style.transform = 'scale(' + s.toFixed(4) + ')';
    pill.style.opacity = s < 0.04 ? '0' : '1';
  }
  window.__RENDER_USE_TEMPLATE_SEEK__ = true;
  window.seekGraphic = seekGraphic;
  function startAnimation() {
    if (window.__RENDER_WAIT_FOR_GO__) { window.__RENDER_ARMED__ = true; return; }
    var overlay = document.querySelector('.overlay');
    if (overlay) overlay.classList.add('is-ready');
  }
  function initGraphic(config) {
    applyGraphic(config);
    if (document.readyState === 'complete') startAnimation();
    else window.addEventListener('load', startAnimation, { once: true });
  }
  window.applyGraphic = applyGraphic;
  window.applyAnimationTiming = applyAnimationTiming;
  window.GRAPHIC = GRAPHIC;
  initGraphic(GRAPHIC);
  </script>
</body>
</html>
