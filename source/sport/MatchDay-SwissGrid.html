<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Matchday intro, Swiss grid</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;display=swap">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .overlay {
      position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      font-family: 'Archivo', system-ui, sans-serif;
      opacity: 0.996;
      --primary: #1D2BFF; --secondary: #0B0B0B; --accent: #FF4D00; --ground: #ECE8DF; --travel: 1;
    }
    .overlay * { box-sizing: border-box; animation-play-state: paused; }
    .overlay.is-ready * { animation-play-state: running; }
    .scene { position: absolute; inset: 0; overflow: hidden; background: var(--ground); }
    .pl { stroke-dasharray: var(--L); animation: draw var(--dur, .6s) cubic-bezier(.6,0,.2,1) both; }
    .vl { transform-origin: 50% 0; animation: vl .7s cubic-bezier(.6,0,.2,1) both; }
    .hl { transform-origin: 0 50%; animation: hl .9s cubic-bezier(.6,0,.2,1) both; }
    .col { animation: colUp .35s cubic-bezier(.2,.9,.1,1) both, colOut .5s cubic-bezier(.7,0,.2,1) forwards; }
    .ftxt { animation: ftxtIn .45s cubic-bezier(.2,.9,.1,1) .85s both, ftxtOut .01s 1.5s forwards; }
    .sec { animation: secShow .01s 2s both, secOut .45s cubic-bezier(.7,0,.2,1) 5.5s forwards; }
    .up { animation: up .55s cubic-bezier(.2,.9,.1,1) both; }
    .fade { animation: fade .5s ease-out both; }
    .panel { animation: panel .5s cubic-bezier(.7,0,.2,1) both; }
    .dot { transform-box: fill-box; transform-origin: center; animation: dot .45s cubic-bezier(.2,1.6,.4,1) both; }
    .prog { transform-origin: 0 50%; animation: hl 3.5s linear 2s both; }
    .stk { animation: stkIn .3s cubic-bezier(.2,.9,.1,1) both, stkOut .25s cubic-bezier(.7,0,.2,1) 7s forwards; }
    .sl { animation: slL .6s cubic-bezier(.2,.9,.1,1) both; }
    .sr { animation: slR .6s cubic-bezier(.2,.9,.1,1) both; }
    .rev { animation: rev .6s cubic-bezier(.7,0,.2,1) both; }
    .drop { animation: drop .45s cubic-bezier(.2,.9,.1,1) both; }
    .tick { animation: tick 2s steps(7, end) 7.5s both; }
    .out { transform: translateY(1080px); }
    .overlay.is-exiting .out { animation: outA 1.2s ease-in-out both; }
    @keyframes draw { from { stroke-dashoffset: var(--L); } to { stroke-dashoffset: 0; } }
    @keyframes vl { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes hl { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes colUp { from { transform: translateY(calc(var(--travel) * 1080px)); } to { transform: translateY(0); } }
    @keyframes colOut { from { transform: translateY(0); } to { transform: translateY(calc(var(--travel) * -1080px)); } }
    @keyframes ftxtIn { from { opacity: 0; transform: translateX(-160px); } to { opacity: 1; transform: none; } }
    @keyframes ftxtOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes secShow { from { visibility: hidden; } to { visibility: visible; } }
    @keyframes secOut { from { transform: translateX(0); } to { transform: translateX(calc(var(--travel) * -2100px)); } }
    @keyframes up { from { transform: translateY(110%); } to { transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes panel { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes dot { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes stkIn { from { transform: scaleX(0) scaleY(1); } to { transform: scaleX(1) scaleY(1); } }
    @keyframes stkOut { from { transform: scaleX(1) scaleY(1); } to { transform: scaleX(1) scaleY(0); } }
    @keyframes slL { from { transform: translateX(-110%); } to { transform: translateX(0); } }
    @keyframes slR { from { transform: translateX(110%); } to { transform: translateX(0); } }
    @keyframes rev { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes drop { from { transform: translateY(-100%); } to { transform: translateY(0); } }
    @keyframes tick { from { transform: translateX(0); } to { transform: translateX(calc(var(--travel) * 700px)); } }
    @keyframes outA { 0% { transform: translateY(-1080px); } 35% { transform: translateY(0); } 65% { transform: translateY(0); } 100% { transform: translateY(1080px); } }
  </style>
</head>
<body>

  <script>
  'use strict';
  var CARD_READY = 8.7;
  var STING_DUR = 1.35;
  var COVER_AT = 0.35;
  var GRAPHIC = {
    text: { team: 'TEAM', news: 'NEWS', startingXi: 'STARTING XI', match: 'MATCH', day: 'DAY', focus: 'FOCUS', teamNews: 'TEAM NEWS' },
    colors: { primary: '#1D2BFF', secondary: '#0B0B0B', accent: '#FF4D00', background: '#ECE8DF' },
    animation: { hold: 10, speed: 1, travel: 1 }
  };
  function num(value, fallback) { var n = Number(value); return isFinite(n) ? n : fallback; }
  function speedOf(animation) { var speed = num(animation && animation.speed, 1); return speed > 0 ? speed : 1; }
  function stingStart(animation) { return Math.max(num(animation && animation.hold, 10), CARD_READY / speedOf(animation)); }
  function endMs(timing) {
    if (!timing) return 0;
    var delay = timing.delay || 0;
    var duration = timing.duration;
    if (typeof duration !== 'number' || !isFinite(duration)) duration = 0;
    if (duration > 0 && duration < 20) duration *= 1000;
    if (delay > 0 && delay < 20) delay *= 1000;
    return delay + duration;
  }
  function setText(id, value) { var el = document.getElementById(id); if (el) el.textContent = value == null ? '' : String(value); }
  function applyGraphic(config) {
    config = config || window.GRAPHIC || GRAPHIC;
    var text = config.text || {};
    var colors = config.colors || {};
    var overlay = document.querySelector('.overlay');
    if (overlay) {
      overlay.style.setProperty('--primary', colors.primary || GRAPHIC.colors.primary);
      overlay.style.setProperty('--secondary', colors.secondary || GRAPHIC.colors.secondary);
      overlay.style.setProperty('--accent', colors.accent || GRAPHIC.colors.accent);
      overlay.style.setProperty('--ground', colors.background || GRAPHIC.colors.background);
    }
    setText('team', text.team != null ? text.team : GRAPHIC.text.team);
    setText('news', text.news != null ? text.news : GRAPHIC.text.news);
    setText('starting-xi', text.startingXi != null ? text.startingXi : GRAPHIC.text.startingXi);
    setText('match', text.match != null ? text.match : GRAPHIC.text.match);
    setText('day', text.day != null ? text.day : GRAPHIC.text.day);
    setText('focus', text.focus != null ? text.focus : GRAPHIC.text.focus);
    setText('team-news', text.teamNews != null ? text.teamNews : GRAPHIC.text.teamNews);
  }
  function applyAnimationTiming(overlay, timing) {
    if (!overlay) return;
    var travel = num(timing && timing.travel, 1);
    if (!(travel > 0)) travel = 1;
    overlay.style.setProperty('--travel', String(travel));
  }
  function seekNode(el, ms) {
    if (!el.getAnimations) return;
    el.getAnimations().forEach(function (anim) {
      anim.pause();
      var timing = anim.effect && anim.effect.getTiming ? anim.effect.getTiming() : null;
      var end = endMs(timing);
      var next = end > 0 && isFinite(end) ? Math.min(Math.max(ms, 0), end) : Math.max(ms, 0);
      try { anim.currentTime = next; } catch (err) { /* ignore */ }
    });
  }
  function clearBake(root) {
    var nodes = [root].concat(Array.prototype.slice.call(root.querySelectorAll('[data-bake]')));
    nodes.forEach(function (el) {
      ['opacity', 'visibility', 'transform', 'filter', 'clipPath', 'webkitClipPath', 'letterSpacing', 'strokeDashoffset', 'animation'].forEach(function (prop) { el.style[prop] = ''; });
      el.removeAttribute('data-bake');
    });
  }
  function bake(root) {
    var nodes = [root].concat(Array.prototype.slice.call(root.querySelectorAll('*')));
    nodes.map(function (el) { return { el: el, cs: getComputedStyle(el) }; }).forEach(function (item) {
      var el = item.el; var cs = item.cs;
      el.style.opacity = cs.opacity;
      el.style.visibility = cs.visibility;
      if (cs.transform && cs.transform !== 'none') el.style.transform = cs.transform;
      if (cs.filter && cs.filter !== 'none') el.style.filter = cs.filter;
      if (cs.clipPath && cs.clipPath !== 'none') el.style.clipPath = cs.clipPath;
      if (cs.webkitClipPath && cs.webkitClipPath !== 'none') el.style.webkitClipPath = cs.webkitClipPath;
      if (cs.letterSpacing) el.style.letterSpacing = cs.letterSpacing;
      if (cs.strokeDashoffset) el.style.strokeDashoffset = cs.strokeDashoffset;
      if (cs.animationName && cs.animationName !== 'none') el.style.animation = 'none';
      el.setAttribute('data-bake', '1');
    });
  }
  function prepareFrame(timeSec, config) {
    config = config || window.GRAPHIC || GRAPHIC;
    var overlay = document.querySelector('.overlay');
    var scene = document.getElementById('scene');
    if (!overlay || !scene) return;
    applyGraphic(config);
    applyAnimationTiming(overlay, config.animation || {});
    var speed = speedOf(config.animation);
    var start = stingStart(config.animation);
    var exiting = timeSec >= start;
    overlay.classList.remove('is-ready');
    overlay.classList.toggle('is-exiting', exiting);
    void overlay.offsetHeight;
    var introMs = (exiting ? start : timeSec) * speed * 1000;
    [scene].concat(Array.prototype.slice.call(scene.querySelectorAll('*'))).forEach(function (el) { seekNode(el, introMs); });
    var stingMs = exiting ? (timeSec - start) * speed * 1000 : 0;
    Array.prototype.forEach.call(overlay.querySelectorAll('.out'), function (el) { if (exiting) seekNode(el, stingMs); });
    scene.style.opacity = exiting && ((timeSec - start) * speed) >= (COVER_AT * 1.2) ? '0' : '1';
  }
  function getOverlayRenderDuration(config) {
    config = config || window.GRAPHIC || GRAPHIC;
    var speed = speedOf(config.animation);
    return stingStart(config.animation) + (STING_DUR / speed) + 0.5;
  }
  var previewCoverTimer = null;
  function scheduleExit(config) {
    var overlay = document.querySelector('.overlay');
    var holdSec = (config && config.animation && config.animation.hold != null)
      ? Number(config.animation.hold) : GRAPHIC.animation.hold;
    setTimeout(function () {
      if (overlay) overlay.classList.add('is-exiting');
    }, holdSec * 1000);
  }
  function startAnimation(config) {
    if (window.__RENDER_WAIT_FOR_GO__) {
      window.__RENDER_ARMED__ = true;
      return;
    }
    config = config || window.GRAPHIC || GRAPHIC;
    var overlay = document.querySelector('.overlay');
    var scene = document.getElementById('scene');
    applyAnimationTiming(overlay, config.animation);
    if (scene) scene.style.opacity = '';
    if (overlay) overlay.classList.add('is-ready');
    scheduleExit(config);
    if (previewCoverTimer) clearTimeout(previewCoverTimer);
    var holdSec = (config.animation && config.animation.hold != null)
      ? Number(config.animation.hold) : GRAPHIC.animation.hold;
    previewCoverTimer = setTimeout(function () {
      previewCoverTimer = null;
      if (scene && overlay && overlay.classList.contains('is-exiting')) scene.style.opacity = '0';
    }, (holdSec + COVER_AT * 1.2) * 1000);
  }
  function initGraphic(config) {
    applyGraphic(config);
    applyAnimationTiming(document.querySelector('.overlay'), (config && config.animation) || {});
    if (window.__RENDER_WAIT_FOR_GO__) window.__RENDER_ARMED__ = true;
  }
  window.prepareFrame = prepareFrame;
  window.getOverlayRenderDuration = getOverlayRenderDuration;
  window.GRAPHIC = GRAPHIC;
  initGraphic(GRAPHIC);
  </script>
</body>
