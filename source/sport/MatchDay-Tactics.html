<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Matchday intro, tactics board</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&amp;family=Permanent+Marker&amp;display=swap">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .overlay {
      position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent;
      --primary: #F5D547; --secondary: #F3F1E8; --accent: #E4572E; --ground: #123829;
      --travel: 1; --tilt-board: -1.5deg; --tilt-tape1: -3deg; --tilt-tape2: 2.5deg;
      font-family: 'Kalam', system-ui, sans-serif;
      opacity: 0.996;
    }
    .overlay * { box-sizing: border-box; animation-play-state: paused; }
    .overlay.is-ready * { animation-play-state: running; }
    
body{margin:0}
a{color:#ffffff}a:hover{color:#dddddd}
.stage{font-family:'Kalam',system-ui,sans-serif}
.stage *{box-sizing:border-box}
.pl{stroke-dasharray:var(--L);stroke-dashoffset:0}
.pl{animation:draw var(--dur,.6s) cubic-bezier(.6,0,.2,1) both}
@keyframes draw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}




/* ---------- variant ---------- */

.mag{transform-box:fill-box;transform-origin:center;transform:scale(1);opacity:1}
.mag{animation:mag .4s cubic-bezier(.2,1.3,.4,1) both}
@keyframes mag{0%{transform:scale(2.2);opacity:0}55%{transform:scale(.92);opacity:1}100%{transform:scale(1);opacity:1}}
.write{clip-path:inset(0 0 0 0)}
.write{animation:write .7s linear both}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.cam{transform:scale(1.12) rotate(-1.5deg)}
.cam{animation:camC 1.5s cubic-bezier(.3,0,.2,1) 4s both}
@keyframes camC{from{transform:none}to{transform:scale(1.12) rotate(var(--tilt-board))}}
.erase{clip-path:inset(0 0 0 100%)}
.erase{animation:erase .7s linear 5.5s both}
@keyframes erase{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 0 100%)}}
.eraser{opacity:0}
.eraser{animation:eraser .7s linear 5.5s both}
@keyframes eraser{0%{opacity:1;transform:translateX(calc(var(--travel) * -300px)) rotate(-8deg)}100%{opacity:1;transform:translateX(calc(var(--travel) * 2050px)) rotate(-8deg)}}
.tape1{transform:rotate(-3deg)}
.tape1{animation:tape1 .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes tape1{0%{transform:rotate(-7deg) scale(1.4);opacity:0}50%{opacity:1}100%{transform:rotate(var(--tilt-tape1)) scale(1);opacity:1}}
.tape2{transform:rotate(2.5deg)}
.tape2{animation:tape2 .45s cubic-bezier(.2,1.2,.4,1) both}
@keyframes tape2{0%{transform:rotate(7deg) scale(1.4);opacity:0}50%{opacity:1}100%{transform:rotate(var(--tilt-tape2)) scale(1);opacity:1}}
/* ---------- fluid motion ---------- */
.drift{transform:none}
.drift{animation:drift 10.4s cubic-bezier(.25,.1,.25,1) both}
@keyframes drift{0%{transform:scale(1.09) translate(-38px,18px) rotate(-1.2deg)}45%{transform:scale(1.04) translate(16px,-8px) rotate(.5deg)}100%{transform:none}}
.shift{transform:translate(calc(var(--dx) * var(--travel)), calc(var(--dy) * var(--travel)))}
.shift{animation:shift 1.35s cubic-bezier(.45,0,.2,1) 4.05s both}
@keyframes shift{from{transform:translate(0,0)}to{transform:translate(calc(var(--dx) * var(--travel)), calc(var(--dy) * var(--travel)))}}
.float{transform:none}
.float{animation:float 1.6s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0) rotate(0)}to{transform:translateY(-7px) rotate(.7deg)}}
.spin{transform:rotate(4deg)}
.spin{animation:spin 4.6s linear 6s both}
@keyframes spin{from{transform:rotate(-8deg)}to{transform:rotate(4deg)}}
.pulse{transform:scale(1)}
.pulse{animation:pulse .5s cubic-bezier(.2,.8,.3,1) 7s 6}
@keyframes pulse{from{transform:scale(1.07)}to{transform:scale(1)}}
.dust{opacity:0}
.dust{animation:dust 5s linear infinite}
@keyframes dust{0%{opacity:0;transform:translate(0,0)}20%{opacity:.55}100%{opacity:0;transform:translate(40px,-170px)}}
.out{opacity:0;transform:translateY(-1500px)}
.overlay.is-exiting .out{animation:outC 1.2s cubic-bezier(.5,0,.3,1) both}
@keyframes outC{0%{opacity:0;transform:translateY(0) rotate(var(--r)) scale(1.3)}12%{opacity:1;transform:translateY(0) rotate(var(--r)) scale(1)}55%{opacity:1;transform:translateY(0) rotate(var(--r)) scale(1)}100%{opacity:1;transform:translateY(-1500px) rotate(var(--r)) scale(1)}}


  </style>
</head>

  <script>

    setText('matchday', text.matchday != null ? text.matchday : GRAPHIC.text.matchday);

    setText('footer', text.footer != null ? text.footer : GRAPHIC.text.footer);
  }
  function applyAnimationTiming(overlay, timing) {

  function prepareFrame(timeSec, config) {
